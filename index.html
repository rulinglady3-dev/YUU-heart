<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

canvas{
display:block;
position:fixed;
left:0;
top:0;
}

#yu{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

font-family:'Dancing Script',cursive;

font-size:72px;

font-weight:bold;

color:white;

text-shadow:
0 0 8px rgba(255,255,255,.25);

pointer-events:none;

user-select:none;

z-index:5;

}

  #endScreen{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;
flex-direction:column;

background:rgba(0,0,0,.75);

z-index:20;

}

#endText{

color:white;
font-size:32px;
margin-bottom:30px;
text-align:center;

}

#continueBtn{

padding:16px 40px;

background:#ff4d6d;

color:white;

text-decoration:none;

border-radius:40px;

font-size:24px;

font-weight:bold;

transition:.3s;

animation: pulse 2s infinite;

}

#continueBtn:hover{

transform:scale(1.08);

}

  @keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }

}
  
</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div id="yu">yu</div>

  <div id="endScreen">

    <p id="endText">
        It is not over yet
    </p>

    <a id="continueBtn" href="https://rulinglady3-dev.github.io/Heart-animation/" target="_blank">
    Continue Our Journey ❤️
</a>

</div>

<script src="script.js"></script>

</body>
</html>
