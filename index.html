<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

canvas{
display:block;
position:fixed;
left:0;
top:0;
}

#yu{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

font-family:'Dancing Script',cursive;

font-size:72px;

font-weight:bold;

color:white;

text-shadow:
0 0 8px rgba(255,255,255,.25);

pointer-events:none;

user-select:none;

z-index:5;

}

  #endScreen{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;
flex-direction:column;

background:rgba(0,0,0,.75);

z-index:20;

}

#endText{

color:white;
font-size:32px;
margin-bottom:30px;
text-align:center;

}

/* =====================================================
GÜZEL YENİ BUTON
===================================================== */

#continueBtn{

position:relative;

display:flex;

align-items:center;

justify-content:center;

min-width:340px;

padding:19px 35px;

color:white;

font-family:'Dancing Script',cursive;

font-size:30px;

font-weight:bold;

letter-spacing:.5px;

text-decoration:none;

border:1px solid rgba(255,255,255,.5);

border-radius:100px;

background:

linear-gradient(
135deg,
rgba(255,70,115,.55),
rgba(80,8,35,.7)
);

box-shadow:

0 0 18px rgba(255,65,110,.35),

0 12px 40px rgba(0,0,0,.55),

inset 0 1px 1px rgba(255,255,255,.3);

backdrop-filter:blur(12px);

overflow:hidden;

transition:

transform .35s ease,

box-shadow .35s ease,

background .35s ease;

animation:

buttonFloat
2.8s
ease-in-out
infinite;

}


/* Butonun üzerinden geçen ışık */

#continueBtn::before{

content:"";

position:absolute;

top:-30%;

left:-80%;

width:45%;

height:160%;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.55),

transparent

);

transform:rotate(20deg);

animation:

buttonShine
4s
ease-in-out
infinite;

}


/* İç çerçeve */

#continueBtn::after{

content:"";

position:absolute;

inset:3px;

border-radius:100px;

border:1px solid rgba(255,255,255,.12);

pointer-events:none;

}


/* Üzerine gelince */

#continueBtn:hover{

transform:

translateY(-6px)

scale(1.06);

background:

linear-gradient(

135deg,

rgba(255,75,125,.85),

rgba(125,15,55,.85)

);

box-shadow:

0 0 35px rgba(255,65,115,.75),

0 18px 50px rgba(0,0,0,.6);

}


/* Tıklanınca */

#continueBtn:active{

transform:

translateY(0)

scale(.96);

}


/* Hafif süzülme */

@keyframes buttonFloat{

0%,
100%{

transform:
translateY(0);

}

50%{

transform:
translateY(-7px);

}

}


/* Parlayan ışık */

@keyframes buttonShine{

0%{

left:-80%;

}

45%{

left:140%;

}

100%{

left:140%;

}

}


/* Telefon */

@media(max-width:600px){

#continueBtn{

min-width:80vw;

font-size:26px;

padding:

18px
22px;

}

}
  
</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div id="yu">yu</div>

  <div id="endScreen">

    <p id="endText">
        It is not over yet
    </p>

    <a id="continueBtn" href="https://rulinglady3-dev.github.io/Heart-animation/" target="_blank">
    Continue Our Journey ❤️
</a>

</div>

<script src="script.js"></script>

</body>
</html>
